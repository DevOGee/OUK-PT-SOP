# This workflow lets you generate a SLSA provenance file for your project.
# Meets SLSA Level 3 requirements: https://slsa.dev/spec/v0.1/requirements

name: SLSA generic generator

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # Maps the step output to the job output so the provenance job can read it
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ========================================================
      # Step 1: Build your artifacts.
      # Replace these echo commands with your actual build process.
      # ========================================================
      - name: Build artifacts
        run: |
          echo "artifact1" > artifact1
          echo "artifact2" > artifact2

      # ========================================================
      # Step 2: Generate the provenance subjects (sha256 sums)
      # ========================================================
      - name: Generate subject for provenance
        id: hash
        run: |
          set -euo pipefail

          # List the artifacts the provenance will refer to.
          files=$(ls artifact*)

          # Generate the subjects (base64 encoded).
          echo "digests=$(sha256sum $files | base64 -w0)" >> "$GITHUB_OUTPUT"

      # ========================================================
      # Step 3: Upload the artifacts to the workflow run
      # NOTE: v2+ of the SLSA generator requires upload-artifact@v4
      # ========================================================
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: artifact*
          if-no-files-found: error
          retention-days: 5

  provenance:
    needs: [build]
    permissions:
      actions: read   # Required to read the workflow path.
      id-token: write # Required to sign the provenance using OIDC.
      contents: write # Required to add assets to a GitHub release.
    # UPGRADED: Now pointing to v2.1.0
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      # Dynamically determines if it should attach the .build.slsa file to a GitHub Release
      upload-assets: ${{ github.event_name == 'release' }}